name: Generate Gradle Wrapper

# Запуск вручную со страницы GitHub: Actions → Generate Gradle Wrapper → Run workflow
on:
  workflow_dispatch:
    inputs:
      gradle_version:
        description: 'Gradle version for wrapper'
        required: true
        default: '8.9'

# Нужно право коммитить
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      # Проверить, что .gitignore не блокирует файлы обёртки
      - name: Verify .gitignore does not block wrapper files
        run: |
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if git check-ignore -q "$f"; then
              echo "::error::$f is ignored by .gitignore"
              echo "Add exception in .gitignore or remove the ignore rule."
              exit 1
            fi
          done
          echo "✅ .gitignore does not block wrapper files"

      # Генерация в изоляции: временно прячем build-файлы,
      # чтобы gradle не конфигурировал проект и не пытался резолвить AGP.
      - name: Generate wrapper (isolated from project config)
        run: |
          set -e

          mkdir -p .__hidden/app

          # Прячем всё, что триггерит разрешение плагинов
          [ -f build.gradle.kts ]       && mv build.gradle.kts       .__hidden/       || true
          [ -f settings.gradle.kts ]    && mv settings.gradle.kts    .__hidden/       || true
          [ -f app/build.gradle.kts ]   && mv app/build.gradle.kts   .__hidden/app/   || true

          # Минимальный settings — без плагинов
          echo 'rootProject.name = "Graphene-client"' > settings.gradle.kts

          # Генерируем wrapper
          gradle wrapper --gradle-version ${{ inputs.gradle_version }} --distribution-type bin

          # Убираем минимальный settings
          rm -f settings.gradle.kts

          # Восстанавливаем всё обратно
          [ -f .__hidden/build.gradle.kts ]     && mv .__hidden/build.gradle.kts     .          || true
          [ -f .__hidden/settings.gradle.kts ]  && mv .__hidden/settings.gradle.kts  .          || true
          [ -f .__hidden/app/build.gradle.kts ] && mv .__hidden/app/build.gradle.kts app/       || true
          rm -rf .__hidden

          echo "--- generated files ---"
          ls -la gradlew gradlew.bat gradle/wrapper/

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify wrapper works
        run: |
          ./gradlew --version
          ./gradlew --version | grep -q "Gradle ${{ inputs.gradle_version }}"

      # Убрать из основного workflow шаг генерации wrapper — он больше не нужен
      - name: Remove obsolete wrapper step from other workflows
        run: |
          for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$wf" ] || continue
            [ "$wf" = ".github/workflows/generate-wrapper.yml" ] && continue
            if grep -q "gradle wrapper --gradle-version" "$wf"; then
              echo "Removing obsolete step from $wf"
              # Удаляем строку с командой
              sed -i '/gradle wrapper --gradle-version/d' "$wf"
              # Удаляем пустую строку или name шага, если остался
              # (мягко — не ломаем YAML, если name шёл отдельной строкой)
            fi
          done

      - name: Commit and push
        run: |
          set -e

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Всё, что нужно закоммитить
          git add gradlew gradlew.bat gradle/wrapper/ 2>/dev/null || true
          git add .github/workflows/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes — wrapper already up to date"
            exit 0
          fi

          git commit -m "chore: generate gradle wrapper ${{ inputs.gradle_version }} [skip ci]"
          git push origin HEAD:main